name: Validate Sigma Rules

on:
  push:
    paths:
      - 'docs/detection-rules/**'
      - 'utils/sigma-converter/**'
  pull_request:
    paths:
      - 'docs/detection-rules/**'
      - 'utils/sigma-converter/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  validate:
    name: Validate Rules & Dashboards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utils/sigma-converter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: utils/sigma-converter/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Sigma rules
        run: pytest test_rules.py -v --tb=short

      - name: Validate conversions
        run: pytest test_convert.py -v --tb=short

      - name: Validate dashboards
        run: pytest test_dashboards.py -v --tb=short

      - name: Validate Sigma bundle
        run: pytest test_bundle.py -v --tb=short

      - name: Run full conversion
        run: make all

      - name: Verify generated files
        run: |
          echo "Splunk rules: $(ls ../../docs/detection-rules/splunk/rules/*.spl 2>/dev/null | wc -l)"
          echo "OpenSearch rules: $(ls ../../docs/detection-rules/opensearch/rules/*.dql 2>/dev/null | wc -l)"
          echo "Sentinel rules: $(ls ../../docs/detection-rules/sentinel/rules/*.kql 2>/dev/null | wc -l)"

      - name: Verify Sigma bundle
        run: |
          ZIP=../../docs/detection-rules/sigma_rules.zip
          test -f "$ZIP" || { echo "::error::$ZIP not generated by 'make all'"; exit 1; }
          COUNT=$(unzip -l "$ZIP" | grep -c '\.yml$')
          echo "sigma_rules.zip entries: $COUNT"
          test "$COUNT" -eq 68 || { echo "::error::expected 68 rules in bundle, got $COUNT"; exit 1; }

      - name: Ensure committed bundle is not stale
        run: |
          # 'make all' regenerated the deterministic zip in place; it must be
          # byte-identical to the committed artifact (regenerate + recommit if not).
          if ! git diff --quiet -- ../../docs/detection-rules/sigma_rules.zip; then
            echo "::error::sigma_rules.zip is stale — run 'make sigma-bundle' and commit the result"
            git diff --stat -- ../../docs/detection-rules/sigma_rules.zip
            exit 1
          fi
